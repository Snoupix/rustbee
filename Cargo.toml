[package]
name = "rustbee"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.49", features = ["derive"] }
color_space = "0.5.4"
tokio = { version = "1.48.0", features = ["fs", "rt", "macros", "signal", "rt-multi-thread", "time"] }
rustbee-common = { path = "rustbee-common" }
btleplug = "0.11.8"
futures = "0.3.31"
