[package]
name = "rustbee-common"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib"]

[features]
default = []
ffi = []

[dependencies]
bluest = "0.6.9"
btleplug = "0.11.8"
chrono = "0.4.39"
color_space = "0.5.4"
eframe = { version = "0.33.0", features = ["persistence"] }
futures = "0.3.31"
interprocess = { version = "2.2.2", features = ["tokio"] }
log = "0.4.28"
serde = "1.0.228"
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["fs", "macros", "process", "signal"] }
uuid = "1.18.1"
windows = { version = "0.58.0", features = ["Devices_Bluetooth", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
